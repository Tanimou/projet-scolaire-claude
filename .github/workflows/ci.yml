name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Concrete, and equal to `.nvmrc` and the three `ARG NODE_VERSION` defaults.
  # It was '22' — a floating major that resolves to the newest 22.x today, but
  # whose declared meaning includes 22.0-22.11, the window in which the API
  # cannot boot at all (jose@6 is ESM-only and jwks-rsa require()s it, PF-73).
  # `scripts/runtime-engines-check.js` fails if these four ever disagree.
  NODE_VERSION: '22.13.1'
  PNPM_VERSION: '9.12.3'

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The runtime every other job runs on. `engines.node` claimed `>=20.0.0`
      # while the API cannot start below 20.19/22.12 — jose@6 is ESM-only and
      # jwks-rsa require()s it, on the boot path via AuthModule (PF-73). Nothing
      # checked the claim; 35 installed dependencies contradicted it. This also
      # holds NODE_VERSION / PNPM_VERSION above to `.nvmrc`, the Dockerfiles and
      # `packageManager`. Kept in step with scripts/ci-gate.sh stage 0 — the two
      # must not drift (S-E02-2 AC-4).
      - run: node scripts/runtime-engines-check.js

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      # Production artefacts (S-E06-1 / PF-17, PF-54). Four surfaces of the
      # hosted deployment told real users to look for their activation email in
      # `http://localhost:1080` — a Maildev container that exists only in a
      # developer's compose stack — and the Keycloak admin client resolved its
      # credentials with `?? 'admin'` while compose declared neither variable.
      # Both were found by reading; nothing executed. This step reads source
      # only, so it needs no Prisma client and no build: it belongs early, where
      # it fails on the diff rather than ten minutes later. Kept in step with
      # scripts/ci-gate.sh stage 0b — the two must not drift (S-E02-2 AC-4).
      - run: node scripts/production-artefact-check.js
      # Compose invocation (S-E02-16 / PF-86). The documented way to start the
      # local stack started a DIFFERENT stack: compose resolves `.env` from the
      # compose file's directory (`infra/`), `infra/.env` does not exist, and the
      # ports live in the root `.env`, so the documented command fell through to
      # `${VAR:-default}`. Worse, inside the compose file itself KC_HOSTNAME and
      # KEYCLOAK_PUBLIC_URL hard-coded `localhost:8180` while the port defaulted
      # to 8080 — the announced token issuer was reachable on no port and the api
      # rejected every token, so login was broken by construction on that path.
      # Source-only, so it belongs here with the other early readers. It also
      # executes `docker compose config` in both directions where a docker binary
      # exists (it does on ubuntu-latest); `.env` is gitignored, so the accepting
      # probes are reported as not-executed here rather than silently skipped.
      # Kept in step with scripts/ci-gate.sh stage 0c (S-E02-2 AC-4).
      - run: node scripts/compose-invocation-check.js
      # Audit writes (S-E04-7 / PF-31). Every `auditLog.create` under the walk
      # root apps/api/src + apps/worker/src + packages/imports-core/src is either
      # behind `writeAudit(tx, {…})` inside a transaction, or carries a reviewed
      # baseline row whose finding id RESOLVES against
      # docs/daily-improvement-v3/audit-findings-index.md — resolves, not merely
      # matches PF-nnn, which is the S-E06-5 defect turned into a check. It also
      # fails any writeAudit call given a non-transactional first argument, a
      # non-literal second argument, or sitting inside a try block.
      # Source-only: no build, no database, no generated Prisma client, so it
      # belongs HERE and not in the build job, which PF-126 makes the least
      # reliable place in the harness. Blocking: the job fails on its exit code,
      # and no failure-tolerating key is attached to this step.
      # Kept in step with scripts/ci-gate.sh stage 0d (S-E02-2 AC-4) — the two
      # must not drift.
      - run: node scripts/audit-write-check.js
      # CSV escapers (S-E05-1 / PF-168, ADR-037 D8). One security predicate had
      # FIVE implementations at HEAD, so the same operator-entered string escaped
      # three different ways depending on which export button emitted it. The
      # neutraliser now lives once in packages/contracts/src/security/csv-injection.ts
      # and this stage is the ratchet that keeps it there: it fails on a CSV
      # escaper outside the two sanctioned ones (matched by NAME *or* by the
      # RFC-4180 quote-doubling SHAPE, because two of the five deleted copies were
      # called `escapeCell`), on the trigger set re-assembled anywhere else, and
      # on a sanctioned escaper that stops importing and calling neutraliseCsvCell.
      # The walk root includes .tsx — three of the copies lived in components, and
      # a .ts-only walk would certify a surface it could not see (S-E06-5).
      # Source-only: no build, no database, no generated Prisma client, so it
      # belongs HERE and not in the build job (PF-126). Blocking: the job fails on
      # its exit code, and no failure-tolerating key is attached to this step —
      # rule C is the ONLY executed evidence that the WEB half of S-E05-1 is
      # wired, since apps/web has no unit runner (PF-129/PF-133).
      # Kept in step with scripts/ci-gate.sh stage 0d-bis (S-E02-2 AC-4) — the two
      # must not drift.
      - run: node scripts/csv-escape-check.js
      # Per-portal OIDC client identity (S-E01-4b / PF-18, ADR-052). One rule —
      # "which OIDC client does portal X speak to?" — used to live in more than
      # one place with a `student -> parent` alias in the copies, which collapsed
      # `azp` so a student's token was indistinguishable from a parent's. This
      # stage derives the rule by EXECUTING apps/web/src/lib/keycloak-clients.ts
      # (not by lifting its constants: PF-18's shape was an alias inside a
      # function body, invisible to a constant-lifting gate) and asserts a
      # BIJECTION portal <-> client against infra/keycloak/realm-export.json and
      # infra/kc-prod-redirects.mjs — injective, total, closed, env-safe, plus a
      # four-portal vacuity floor.
      # It is unconditional for the same reason its ci-gate.sh sibling is:
      # ci-gate.sh:330's GATE_MACHINERY excludes apps/web, so the api spec that
      # states these invariants does not run on a fast-tier PR editing the
      # accessor. Source-only (~1.5s): no build, no database, no Docker, no
      # generated Prisma client, so it belongs in this job (PF-126). Blocking: the
      # job fails on its exit code and NO failure-tolerating key is attached to
      # this step — a continue-on-error here would be DNC-10.
      # Kept in step with scripts/ci-gate.sh stage 0d-ter (S-E02-2 AC-4) — the two
      # must not drift.
      - run: node scripts/keycloak-client-check.js
      # `lint` dependsOn `^build` in turbo.json, and the API build needs the
      # generated Prisma client — without this the lint job dies on unresolvable
      # `@prisma/client` types rather than on a lint rule.
      - run: pnpm --filter @pilotage/api prisma generate
      - run: pnpm lint
      # `pnpm lint` fails on errors only. The ratchet is what makes the warning
      # count binding, in both directions. Kept in step with scripts/ci-gate.sh
      # stage 2 — the two must not drift (S-E02-2 AC-4).
      - run: node scripts/lint-ratchet.js

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pilotage/api prisma generate
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pilotage
          POSTGRES_PASSWORD: pilotage
          POSTGRES_DB: pilotage
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U pilotage"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://pilotage:pilotage@localhost:5432/pilotage?schema=public
      # S-E01-2b — the NON-OWNER role the RLS policies are proven against.
      #
      # It is declared here and not derived, because `.env` is gitignored: a fresh
      # checkout has no source for it, and `scripts/rls-isolation-check.js` FAILS
      # rather than guessing a credential. The role does not exist in the service
      # container above (roles are cluster state and the image ships none); the
      # checker creates it, because `POSTGRES_USER` IS the bootstrap superuser
      # there, and drops it again at the end.
      #
      # This is an ADDRESS, never a bypass: before any visibility assertion the
      # checker asserts over this very connection that `current_user` owns none of
      # the tables under test and does not carry BYPASSRLS. Pointing it at the
      # owner therefore makes the step FAIL, not pass.
      DATABASE_URL_APP: postgresql://app_user:app_user@localhost:5432/pilotage?schema=public
      # S-E06-1 / PF-54 — `KEYCLOAK_URL` and the two admin credentials no longer
      # have `??` defaults, and `JwtStrategy` is constructed by
      # `scripts/boot-check.js` when it compiles the real module graph. The
      # values that satisfy this locally live in `apps/api/.env`, which is
      # gitignored, so a fresh checkout has nothing: without these three lines
      # the boot, observability and tracing steps below would go red on a slice
      # that shipped no bug.
      #
      # Placeholders are honest here rather than a bypass — nothing in
      # boot-check.js, observability-check.js or tracing-check.js opens a
      # connection to Keycloak. They are deliberately NOT `admin`/`admin`, so
      # this block can never be mistaken for a working credential.
      KEYCLOAK_URL: http://keycloak.invalid:8080
      KEYCLOAK_ADMIN_USER: ci-not-a-real-account
      KEYCLOAK_ADMIN_PASSWORD: ci-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      # Schema drift (S-E02-5 / PF-03 residual). Editing
      # apps/api/prisma/schema.prisma without writing a migration passed every
      # other step here: `prisma generate` below would generate a client for a
      # schema no migration produces, and lint, typecheck, build and boot would
      # all validate against that fiction. This step creates a disposable scratch
      # database in the `postgres` service above, applies
      # apps/api/prisma/migrations to it, diffs THAT DATABASE against the
      # datamodel, and drops it on every exit path — so it proves the migrations
      # EXECUTE, in order, on a real PostgreSQL, not merely that two texts agree.
      # A `--from-migrations` text diff was measured and rejected: on this
      # repository unchanged it returns exit 2, reporting all five PostgreSQL
      # extensions as added although 0_baseline creates every one of them.
      #
      # It runs HERE, before `prisma generate`, because the ledger must be
      # refused before a client is generated against a schema nothing can build.
      # It runs in THIS job because this is the only job that provisions a
      # postgres service and a DATABASE_URL; it needs an empty PostgreSQL SERVER,
      # not the project's data (docs/adr/ADR-027-schema-drift-gate-needs-a-database.md).
      # Deleting the service above would turn this step red, so the guard spec
      # asserts the service is still declared. No continue-on-error: a check that
      # cannot run is a failure, never a skip (DNC-08). Kept in step with
      # scripts/ci-gate.sh stage 0d — the two must not drift (S-E02-2 AC-4).
      - run: node scripts/schema-drift-check.js
      # S-E01-2b — the RLS half, and it is NOT redundant with the step above.
      # `prisma migrate diff` cannot see policies: measured, with the policies and
      # GRANTs installed it still returns "No difference detected", exit 0. So the
      # drift step can never observe a policy dropped out of band, nor a 45th
      # tenant_id table shipped without one. This step is the only thing that can,
      # and it proves it by EXECUTION — scratch database, full ledger applied,
      # connected AS app_user, rows appearing and disappearing as the tenant GUC
      # changes, with the positive control asserted FIRST (app_user had zero
      # privileges before the migration, so "foreign rows are invisible" alone
      # would be green on a database with no policies at all).
      #
      # No continue-on-error: a check that cannot run is a failure, never a skip
      # (DNC-08). Kept in step with scripts/ci-gate.sh stage "rls isolation" — the
      # two must not drift (S-E02-2 AC-4).
      - run: node scripts/rls-isolation-check.js
      # S-E01-3 / VAL-02 — the two-tenant ADVERSARIAL suite. It is NOT the step
      # above with a different name: that one proves the policies exist, agree
      # with the catalog and deny on `school` plus the five FK-derived tables.
      # This one enumerates EVERY tenant-bearing table from the live catalog of
      # its own scratch database and runs four verbs against each, in both
      # directions, with the positive control asserted FIRST and the expected
      # outcome per (table, verb) read from `role_table_grants` — so a `42501`
      # from a missing privilege can never be scored as isolation, and a table
      # with no seeded row for the second tenant is named UNCOVERED rather than
      # counted as three green denials on an empty table.
      #
      # It also prints the CUTOVER READINESS block, which is what stops a green
      # here from being read as "safe to switch DATABASE_URL to app_user".
      #
      # No continue-on-error: a check that cannot run is a failure, never a skip
      # (DNC-08). Kept in step with scripts/ci-gate.sh stage "tenant adversarial"
      # — the two must not drift (S-E02-2 AC-4).
      - run: node scripts/tenant-adversarial-check.js
      - run: pnpm --filter @pilotage/api prisma generate
      - run: pnpm build
      # Every stage before this one proves the code compiles; not one of them
      # starts the application. PF-62 (a controller silently unmounted — 404 in
      # production for seven weeks) and R-24 (`import type` erasing the emitted
      # design:paramtypes, breaking DI while `tsc --noEmit` returns 0) both live
      # in that gap. It runs in the build job because it reads dist/. Kept in
      # step with scripts/ci-gate.sh stage 7 — the two must not drift
      # (S-E02-2 AC-4).
      - run: node scripts/boot-check.js
      # TOOL-33 / S-E01-1d (b) — the tenant scope seam, PROVEN BY EXECUTION.
      #
      # ORDERING DEPENDENCY: it drives the COMPILED seam
      # (apps/api/dist/shared/prisma/{prisma.service,tenant-scope,app-role-prisma.service}.js),
      # so it must come after `prisma generate` and after `pnpm build` above —
      # the same guarantee boot-check.js relies on, which is why it sits
      # immediately after it here and immediately after the boot stage in
      # scripts/ci-gate.sh.
      #
      # It is the only thing in the tree that runs a statement through the REAL
      # seam and watches PostgreSQL refuse it. The adversarial check above proves
      # the POLICIES deny for a non-owner role, but it sets the tenant GUC with a
      # hand-written `SET`; this one lets `runWithTenant` set it, asserts the
      # POSITIVE CONTROL first (own-tenant read, update and create all succeed)
      # and only then the cross-tenant denial by primary key, on the Prisma error
      # object and on returned row counts — never on a log line.
      #
      # It builds its own scratch database and applies the ledger with `prisma
      # migrate deploy`; the live database is never touched. It creates `app_user`
      # when the cluster has none, which is the case in this service container
      # (roles are cluster state and the image ships none), and drops it again.
      # The role must exist BEFORE the ledger is applied: the RLS migration guards
      # its GRANTs behind `has_app_user` and exits 0 with a NOTICE when false.
      #
      # No continue-on-error: a check that cannot run is a failure, never a skip
      # (DNC-08) — a missing dist/ or generated client exits 1 naming the command
      # that produces it. Kept in step with scripts/ci-gate.sh stage
      # "tenant scope (executed proof)" — the two must not drift (S-E02-2 AC-4).
      # Decision record: docs/adr/ADR-048-tenant-scope-two-connections.md.
      - run: node scripts/tenant-scope-check.js
      # The boot check cannot cover apps/web — Next.js has no module graph to
      # construct — so the third artefact of a three-artefact deployment had no
      # build-output assertion at all. Measured: with apps/web/.next deleted
      # entirely, boot-check.js still returned exit 0. That is R-25 at the web
      # address. Also holds the release gate's web third (/version/web) to being
      # dynamic rather than frozen at build time. Kept in step with
      # scripts/ci-gate.sh stage 8 — the two must not drift (S-E02-2 AC-4).
      - run: node scripts/web-artifact-check.js
      # The `obs` compose profile (Prometheus/Grafana/Loki) has been declared
      # since it was written and never once read: all three of its bind-mount
      # sources were absent from the repository, and no application registered a
      # single metric (PF-56). This step reads the profile — scrape targets must
      # name real services on the ports they really listen on, scraped paths must
      # be routes the applications really boot, dashboards must query metrics
      # that really exist, and nginx must not publish /metrics. Reads dist/, so
      # it belongs to the build job. Kept in step with scripts/ci-gate.sh
      # stage 9 — the two must not drift (S-E02-2 AC-4).
      #
      # S-E02-15 (PF-79) widened this step from two artefacts to THREE. apps/web
      # was covered by nothing and this step exited 0 on that exact state. It now
      # reads apps/web's registry too, compares the scraped path against the path
      # its dedicated socket really serves, and asserts that path is NOT in the
      # Next route inventory — nginx `location /` would publish it the day it
      # became a route, and the nginx rule above would not notice. No new step
      # was added, deliberately: widening keeps the two files in step.
      #
      # S-E02-17 (PF-56, queue third) widened it again, on the QUEUES this time.
      # The step now also holds instrumented queues == registered queues, failing
      # in BOTH directions: a registered queue nobody instruments is invisible on
      # a dashboard that still looks healthy, an instrumented queue nobody
      # registers is a series pinned at zero that reads as an idle queue.
      # "Registered" is the RESOLVED BullModule.registerQueue registration read
      # off the built modules, not the exported constant. It is also the first
      # thing that ever compares apps/api's and apps/worker's queue-name blocks.
      # Still no new step, for the same reason as last time.
      - run: node scripts/observability-check.js

      # Tracing (S-E02-14 / PF-78) — the traces half of PF-56. A `jaeger`
      # service and an OTLP endpoint were declared for as long as the `obs`
      # profile existed, and no application emitted a single span. This step
      # holds the load order on the emitted main.js (OpenTelemetry patches
      # modules as they load, so a SDK started too late patches nothing and
      # says nothing) and then spawns a child process that serves a real
      # request and fails if no span comes out. Reads dist/, so it belongs to
      # the build job. Kept in step with scripts/ci-gate.sh stage 10 — the two
      # must not drift (S-E02-2 AC-4).
      #
      # S-E02-15 (PF-79) made this step cover THREE artefacts. TRACED_SERVICES
      # now names web, so a second probe — scripts/web-observability-probe.js —
      # is spawned for it. Web's proof is deliberately a different shape: Next
      # has no main.js and guarantees register() runs before it serves, so a
      # byte-order assertion would be asserting rather than executing. Checked
      # instead: the hook was EMITTED and carries the registered metric names,
      # and a real span yields a histogram SAMPLE labelled by route template —
      # prom-client emits `# TYPE` for a histogram that was never observed, so
      # "registered" is not "measured".
      - run: node scripts/tracing-check.js

      # S-E06-2 / PF-45 — content security policy + branding injection sink.
      # Kept in step with scripts/ci-gate.sh stage 12; the two must not drift
      # (S-E02-2 AC-4), and csp-check.js asserts that both files run it.
      # Reads the EMITTED api main.js and web middleware.js, so it belongs in
      # the build job and after the build: a policy present in source and absent
      # from the artefact protects nobody.
      - run: node scripts/csp-check.js

      # S-E06-3 / PF-19 — link integrity. `/admin/classes/new` was the primary
      # call to action of the admin classes page and was never emitted as a
      # route; it nonetheless RESOLVED, against `/admin/classes/[id]` with
      # `id = "new"`, so the page crashed while a "does this link exist?" check
      # answered yes. The defect is the SHAPE of the match. This step resolves
      # every fully-literal internal link in apps/web/src against the EMITTED
      # route inventory and fails unconditionally on a literal that only
      # resolves because a single-segment [param] swallowed it, and on a dead
      # target absent from the reviewed ceiling. Reads .next/, so it belongs in
      # the build job and after the build. Kept in step with scripts/ci-gate.sh
      # stage 13; the two must not drift (S-E02-2 AC-4).
      - run: node scripts/link-integrity-check.js

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pilotage/api prisma generate
      # Was `pnpm test --if-present`. `--if-present` is a pnpm flag, not a turbo
      # one, so turbo received it as an unknown argument — and more importantly the
      # phrasing invited "no test script? then nothing to check". Both suites are
      # now run through the ratchet, which fails on any NEW failure and on any
      # baseline entry that starts passing. See scripts/test-ratchet.js.
      - run: node scripts/test-ratchet.js api
      - run: node scripts/test-ratchet.js worker
