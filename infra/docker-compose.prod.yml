# =============================================================================
# Pilotage Scolaire — PRODUCTION override (Hostinger VPS srv861861.hstgr.cloud)
# -----------------------------------------------------------------------------
# Layered on top of infra/docker-compose.yml. It does THREE things:
#   1. Rewrites every browser-facing URL from localhost → the real public origin
#      (${PUBLIC_BASE_URL}). NEXT_PUBLIC_* are also passed as BUILD ARGS because
#      Next.js inlines them at build time (runtime env can't override them).
#   2. Serves Keycloak under the `/auth` path (KC_HTTP_RELATIVE_PATH) so the whole
#      platform lives on a SINGLE origin behind one reverse proxy.
#   3. Plugs our own nginx into the host's EXISTING Traefik (external network
#      `root_web`) so Traefik terminates TLS (Let's Encrypt) and routes
#      Host(${PUBLIC_HOST}) → nginx → {web, api, keycloak}. Nothing the host
#      already runs is touched — we only ADD a labelled service.
#
# Usage (from repo root, on the server):
#   docker compose --env-file .env.prod \
#     -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
#     --profile app --profile prod up -d --build
# (the wrapper scripts/deploy-prod.sh does this + schema sync + the seed chain)
#
# Required .env.prod keys: PUBLIC_BASE_URL, PUBLIC_HOST, AUTH_SECRET, and the
# 127.0.0.1-bound *_PORT values (so no infra port is exposed publicly — the VPS
# firewall is open, so DB/Redis/MinIO MUST NOT bind 0.0.0.0).
# =============================================================================

networks:
  # The host's Traefik lives here (created by /root/docker-compose.yml). We attach
  # nginx to it so Traefik can reach us; we never redefine or own it.
  root_web:
    external: true

services:

  # ---- Keycloak: public issuer under /auth, behind the TLS-terminating proxy ----
  keycloak:
    environment:
      # The public base MUST include the /auth path: in Keycloak 26 the realm
      # issuer = KC_HOSTNAME + /realms/<realm>, and KC_HTTP_RELATIVE_PATH alone is
      # NOT folded into the advertised issuer. So we put /auth in KC_HOSTNAME (→ iss
      # = ${PUBLIC_BASE_URL}/auth/realms/pilotage-scolaire, matching the api/web
      # KEYCLOAK_PUBLIC_URL) and keep the matching serving path below.
      KC_HOSTNAME: ${PUBLIC_BASE_URL}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: "false"
      # Backchannel resolved from the request host → internal services reach
      # token/jwks at http://keycloak:8080/auth without a public hairpin.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
    # The management health endpoint moves under the relative path too, so the base
    # image's /health/ready probe 404s (→ false 'unhealthy'). Probe /auth/health/ready.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---- API: validate the public issuer, fetch JWKS internally ----
  api:
    environment:
      NODE_ENV: production
      KEYCLOAK_URL: http://keycloak:8080/auth          # internal JWKS / admin ops
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_BASE_URL}/auth      # expected token issuer base
      WEB_PUBLIC_URL: ${PUBLIC_BASE_URL}
      CORS_ORIGINS: ${PUBLIC_BASE_URL}
      # S-E06-1 / PF-54 — l'API n'a plus de défaut `?? 'admin'` pour ces deux
      # valeurs. La forme `${VAR:?…}` est délibérée : compose REFUSE la commande
      # de déploiement, en nommant la clé, au lieu de démarrer un conteneur qui
      # bouclerait sur un crash sur le serveur. L'échec se produit dans le
      # terminal de l'opérateur, pas dans les logs à 2 h du matin.
      #
      # Aucun identifiant n'est tourné ici : sur la stack hébergée actuelle ces
      # valeurs sont `admin`/`admin`, à déclarer dans `.env.prod`. La rotation
      # (côté Keycloak PUIS côté .env.prod) est une action opérateur, tracée et
      # non exécutée par cette story.
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:?requis depuis S-E06-1 — declarez-le dans .env.prod}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?requis depuis S-E06-1 — declarez-le dans .env.prod}
      # S-E04-3 / ADR-036 D2-D3 — `N = 2` ICI et nulle part ailleurs : Traefik
      # (hôte, TLS) → nginx (conteneur) → api. Même forme refusante, même raison :
      # un compte de sauts faux ne plante pas, il enregistre l'adresse d'un relais
      # comme celle de l'opérateur, pour toujours et pour tout le monde.
      #
      # Si l'arête change (un CDN devant Traefik, nginx retiré du chemin),
      # re-dérouler la procédure D7 et réenregistrer la valeur DANS l'ADR — pas
      # dans un commentaire à côté du code.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:?requis depuis S-E04-3 — ADR-036 D3, declarez-le dans .env.prod (2 = Traefik -> nginx -> api)}

  # ---- Worker: same issuer wiring + public web origin for email deep-links ----
  worker:
    environment:
      NODE_ENV: production
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_BASE_URL}/auth
      WEB_PUBLIC_URL: ${PUBLIC_BASE_URL}

  # ---- Web (Next.js): public env baked at BUILD + server-side runtime wiring ----
  web:
    build:
      args:
        # Inlined into the client bundle. The browser hits the API same-origin and
        # Keycloak under /auth on the public host.
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}
        NEXT_PUBLIC_KEYCLOAK_URL: ${PUBLIC_BASE_URL}/auth
        NEXT_PUBLIC_KEYCLOAK_REALM: pilotage-scolaire
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}
      NEXT_PUBLIC_KEYCLOAK_URL: ${PUBLIC_BASE_URL}/auth
      # Server-side auth.ts: discovery/ROPC/refresh go internal; provider `issuer`
      # is the public one (matches token iss).
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_BASE_URL}/auth
      # NextAuth: trustHost is already true in code; AUTH_URL is https → secure
      # cookies are correctly enabled (the platform is served over TLS by Traefik).
      AUTH_URL: ${PUBLIC_BASE_URL}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET}
      # S-E04-3 / ADR-036 D10 — `W = 2` : Traefik (hôte, TLS) → nginx (conteneur)
      # → web. `location /` (infra/nginx/conf.d/pilotage.conf) pose bien
      # `X-Forwarded-For`, donc la chaîne de profondeur 2 est réelle.
      #
      # Clé DISTINCTE de `TRUST_PROXY_HOPS` (service `api` ci-dessus) : ici le
      # `NEXT_PUBLIC_API_URL` du web est l'origine publique, donc les deux seams
      # serveur repassent par Traefik → nginx. Les deux chemins se comptent
      # séparément ; une clé unique en rendrait un des deux silencieusement faux.
      #
      # Même forme refusante, même raison qu'ailleurs — sauf que l'échec qu'elle
      # prévient n'est pas un crash : sans elle, `webTrustProxyHops()` retombe sur
      # `0`, aucun `x-pilotage-client-ip` n'est jamais émis, et
      # `AuditLog.ipAddress` reste NULL sur toute écriture pilotée par l'UI — une
      # fonctionnalité livrée inerte, dont le seul signal est un `console.warn`.
      #
      # Si l'arête change, re-dérouler la procédure ADR-036 D7 et réenregistrer la
      # valeur DANS l'ADR, pas dans un commentaire à côté du code.
      WEB_TRUST_PROXY_HOPS: ${WEB_TRUST_PROXY_HOPS:?requis depuis S-E04-3 — ADR-036 D10, declarez-le dans .env.prod (2 = Traefik -> nginx -> web)}

  # ---- Migrator: applique les migrations revues (prisma migrate deploy) ----
  # La commande est héritée de docker-compose.yml : l'entrypoint sûr
  # infra/docker/migrate-entrypoint.sh. Aucune surcharge nécessaire ici — et
  # surtout aucune réintroduction de `db push` (PF-03 / S-E02-1).
  migrator:
    environment:
      NODE_ENV: production

  # ---- Seed (provisionnement de démonstration, one-shot) ----
  # S-E02-4 / PF-03 « moitié seed », risque R-12.
  #
  # Ce bloc portait `NODE_ENV: development` — le SEUL service de ce fichier à ne
  # pas recevoir `production` — avec un commentaire disant explicitement pourquoi :
  # « MUST run as non-production (seed-demo.ts hard-aborts when NODE_ENV=production) ».
  # C'était un contournement documenté du seul garde-fou existant. Il est supprimé.
  #
  # Le service hérite désormais de `NODE_ENV` de la stack et lit `DEPLOY_ENV`.
  # `prisma/seed-guard.ts` refuse dès qu'un des deux signaux désigne la production,
  # et refuse aussi leur désaccord — donc rétablir la ligne ci-dessus ne rouvrirait
  # pas la porte, elle produirait `refused-conflicting-signals`.
  #
  # Pour provisionner la démo hébergée (R-12 : les parties prenantes en dépendent),
  # déclarer dans .env.prod :  DEPLOY_ENV=demo  et  ALLOW_SEED=provision-demo-data
  # puis `bash scripts/deploy-prod.sh --seed`. Voir docs/runbooks/provision-demo-tenant.md.
  #
  # Talks to Keycloak admin under /auth; covers BOTH admin-cred env spellings the
  # different seed scripts read (KEYCLOAK_ADMIN/_PASS vs _USER/_PASSWORD).
  seed:
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
      ALLOW_SEED: ${ALLOW_SEED:-}
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: pilotage-scolaire
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASS: admin
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_DEMO_PASSWORD: ${KEYCLOAK_DEMO_PASSWORD:-Demo!2024Pilotage}

  # ---- nginx: single internal entrypoint, published TO Traefik (not to the host) ----
  nginx:
    networks:
      - pilotage      # reach web / api / keycloak
      - root_web      # be reachable by the host's Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_web"
      - "traefik.http.routers.pilotage.rule=Host(`${PUBLIC_HOST}`)"
      - "traefik.http.routers.pilotage.entrypoints=websecure"
      - "traefik.http.routers.pilotage.tls=true"
      - "traefik.http.routers.pilotage.tls.certresolver=mytlschallenge"
      - "traefik.http.services.pilotage.loadbalancer.server.port=80"
