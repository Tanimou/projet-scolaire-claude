# =============================================================================
# Pilotage Scolaire — docker-compose (dev local complet)
# =============================================================================
# Lancement — TOUJOURS depuis la RACINE du dépôt, avec `--env-file .env` :
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
#   docker compose --env-file .env -f infra/docker-compose.yml --profile app up -d
#   docker compose --env-file .env -f infra/docker-compose.yml --profile obs up -d
#   docker compose --env-file .env -f infra/docker-compose.yml down -v
#
# POURQUOI `--env-file .env` N'EST PAS FACULTATIF (PF-86)
# ------------------------------------------------------
# Compose résout `.env` depuis le **project directory** — le dossier du fichier
# compose, donc `infra/` — et non depuis le `cwd` de l'appelant. `infra/.env`
# n'existe pas : les ports vivent dans le `.env` **racine**, à côté de la
# `DATABASE_URL` que prisma, les seeds et les scripts hôte lisent. Sans
# `--env-file .env`, Compose ne voyait aucune de ces variables et retombait
# silencieusement sur les défauts `${VAR:-…}` — donc deux commandes d'apparence
# identique démarraient deux piles différentes, et la différence n'était visible
# que lorsqu'un outil hors conteneur tentait de se connecter.
#
# Le pire n'était pas la divergence entre le `.env` et les défauts, mais la
# divergence **interne à ce fichier** : `KC_HOSTNAME` et `KEYCLOAK_PUBLIC_URL`
# codaient `localhost:8180` en dur pendant que `ports:` publiait `8080` par
# défaut. Sur le chemin documenté, Keycloak signait donc des jetons
# `iss=http://localhost:8180` sur un port que personne ne publiait, et l'API
# rejetait chaque jeton : la connexion était cassée par construction.
#
# Deux corrections, pas une :
#   1. plus AUCUN défaut `${VAR:-…}` sur un port publié — `${VAR:?…}` fait
#      REFUSER Compose, dans le terminal de l'opérateur, en nommant le remède ;
#   2. plus aucun port codé en dur : l'URL publique de Keycloak est dérivée de
#      `${KEYCLOAK_PORT}`, donc les deux ne peuvent plus diverger.
#
# `scripts/compose-invocation-check.js` (stage `ci-gate.sh`) tient les deux.
# `bash infra/pilotage.sh up` fait tout cela pour vous.
# =============================================================================

name: pilotage-scolaire

x-app-env: &app-env
  NODE_ENV: development
  DATABASE_URL: postgresql://pilotage:pilotage@postgres:5432/pilotage?schema=public
  REDIS_URL: redis://redis:6379
  KEYCLOAK_URL: http://keycloak:8080
  # Browser-facing Keycloak URL (must equal KC_HOSTNAME). The api uses it as the
  # expected token issuer; the web uses it as the OIDC issuer + auth-redirect host.
  #
  # DÉRIVÉ de ${KEYCLOAK_PORT}, jamais codé en dur (PF-86). Ce littéral valait
  # `http://localhost:8180` pendant que `keycloak.ports` publiait `8080` par
  # défaut : sur le chemin documenté, l'émetteur annoncé n'était joignable sur
  # aucun port. Un port écrit à deux endroits finit toujours par diverger ; il
  # n'est donc plus écrit qu'à un seul.
  KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT:?KEYCLOAK_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}
  KEYCLOAK_REALM: pilotage-scolaire
  # Compte d'administration Keycloak utilisé par l'API (invitations, MFA,
  # réinitialisations). Ces deux clés étaient ABSENTES de cette ancre : le code
  # retombait sur `?? 'admin'`, donc le défaut était porteur — la pile
  # s'authentifiait réellement en admin/admin sans qu'une ligne ne le dise.
  # Depuis S-E06-1 / PF-54 l'API REFUSE ce défaut et exige la déclaration.
  #
  # Les valeurs reprennent, volontairement, celles que le service `keycloak`
  # crée pour lui-même plus bas (KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD) :
  # cette pile est une pile de développement, et aucun identifiant n'est
  # tourné par cette story. La rotation est une action opérateur.
  KEYCLOAK_ADMIN_USER: admin
  KEYCLOAK_ADMIN_PASSWORD: admin
  KEYCLOAK_ADMIN_CLIENT_ID: portal-admin
  KEYCLOAK_TEACHER_CLIENT_ID: portal-teacher
  KEYCLOAK_PARENT_CLIENT_ID: portal-parent
  # ---- Provenance client (S-E04-3 / PF-31, ADR-036) -------------------------
  #
  # Nombre de proxys inverses entre le socket de l'API et le client. C'est une
  # propriété du DÉPLOIEMENT, pas du code : 0 ici (profil `app` — nginx porte
  # `profiles: ["prod"]` et ne tourne donc pas), 2 en production
  # (Traefik → nginx → api). Un littéral en source serait silencieusement faux
  # dans l'un des deux, et la panne d'un mauvais compte de sauts n'est pas un
  # crash : c'est une adresse *plausible* stockée dans une piste de gouvernance.
  #
  # Forme refusante `${VAR:?}` (précédent KEYCLOAK_PUBLIC_URL / PF-86) : compose
  # refuse la commande en nommant la clé, plutôt que de démarrer un conteneur qui
  # bouclerait sur un crash au preflight (la clé est dans REQUIRED_ENV).
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:?TRUST_PROXY_HOPS manquant — ADR-036 D3, le nombre de proxys est une propriete du deploiement (0 en local, 2 en prod)}
  #
  # Secret partagé `web` ↔ `api` : il autorise les deux seams serveur d'apps/web
  # à DÉCLARER l'adresse et le navigateur réels de l'opérateur. Volontairement
  # PERMISSIF (`:-`) là où le compte de sauts est refusant, et l'asymétrie EST la
  # décision (ADR-036 D9) : un compte de sauts absent est *silencieusement faux*,
  # un jeton absent est *fail-safe* — la provenance devient nulle et l'UI le dit.
  # L'exiger empêcherait de démarrer un opérateur qui n'a pas encore distribué le
  # secret, exactement la pression qui a produit le `?? 'admin'` de PF-54.
  #
  # Déclaré UNE SEULE FOIS, sur l'ancre partagée : il doit être identique octet
  # pour octet dans `api` et dans `web`, et deux déclarations divergent.
  # JAMAIS `NEXT_PUBLIC_*` — Next inline ces variables dans le bundle navigateur.
  AUDIT_FORWARD_TOKEN: ${AUDIT_FORWARD_TOKEN:-}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: pilotage
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: miniominio
  MAIL_HOST: maildev
  MAIL_PORT: "1025"
  MAIL_FROM: "Pilotage scolaire <no-reply@pilotage.local>"
  # Browser-facing web origin — used by the worker to absolutise notification
  # email deep links (e.g. "/parent/grades?..." → full clickable URL).
  WEB_PUBLIC_URL: http://localhost:${WEB_PORT:?WEB_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}
  # OTEL_EXPORTER_OTLP_ENDPOINT n'est DÉLIBÉRÉMENT plus ici (S-E02-14 / PF-78).
  # Posé sur cette ancre partagée, il était distribué à cinq services —
  # migrator, api, worker, web et seed — dont trois ne pouvaient rien émettre :
  # deux sont des jobs one-shot, le troisième était une application Next.js sans
  # la moindre instrumentation. Déclarer un collecteur à un service qui ne
  # l'utilisera jamais, c'est PF-78 en miniature, répété trois fois.
  #
  # Il est désormais posé EXPLICITEMENT sur `api`, `worker` et — depuis
  # S-E02-15 / PF-79 — `web`, qui émet à travers son propre mécanisme
  # (`apps/web/src/instrumentation.ts`, le hook `register()` de Next 15).
  # Le remettre ici le redistribuerait à `migrator` et `seed` et recréerait
  # PF-78 pour les deux jobs one-shot : ne pas le faire.
  #
  # `scripts/tracing-check.js` échoue si cette liste et `TRACED_SERVICES`
  # divergent — dans les deux sens.
  LOG_LEVEL: debug

networks:
  pilotage:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  keycloak_data:

services:

  # -------------------------------------------------------------------------
  # PostgreSQL 15 + extensions
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: pilotage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pilotage
      POSTGRES_PASSWORD: pilotage
      POSTGRES_DB: pilotage
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilotage -d pilotage"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pilotage]

  # -------------------------------------------------------------------------
  # Redis 7 (cache + BullMQ)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pilotage_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:?REDIS_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [pilotage]

  # -------------------------------------------------------------------------
  # Keycloak 26 (auth — 1 realm, 3 clients)
  # -------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: pilotage_keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: "false"
      # Fixed browser-facing frontend URL → token `iss` and the authorization
      # endpoint are always localhost:8180 (browser-reachable), regardless of the
      # internal host the request arrives on. Backchannel-dynamic keeps the
      # token/jwks endpoints on the request host (keycloak:8080) so the api/web
      # containers reach them internally. This makes BOTH the credentials (ROPC,
      # internal) and SSO-redirect (OIDC, browser) flows mint a consistent iss.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:?KEYCLOAK_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:?KEYCLOAK_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [pilotage]

  # -------------------------------------------------------------------------
  # MinIO (S3 compatible — exports PDF, logos, attachments)
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: pilotage_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniominio
    ports:
      - "${MINIO_PORT:?MINIO_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}:9000"
      - "${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [pilotage]

  minio-init:
    image: minio/mc:latest
    container_name: pilotage_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 minio miniominio &&
        (mc mb -p local/pilotage 2>/dev/null || true) &&
        (mc mb -p local/pilotage-public 2>/dev/null || true) &&
        mc anonymous set download local/pilotage-public &&
        echo '✓ MinIO bootstrap complete'
      "
    networks: [pilotage]
    restart: "no"

  # -------------------------------------------------------------------------
  # Maildev (SMTP catcher pour dev)
  # -------------------------------------------------------------------------
  maildev:
    image: maildev/maildev:2.1.0
    container_name: pilotage_maildev
    restart: unless-stopped
    ports:
      - "${MAILDEV_SMTP_PORT:?MAILDEV_SMTP_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}:1025"
      - "${MAILDEV_WEB_PORT:?MAILDEV_WEB_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}:1080"
    # The image's built-in healthcheck reads ${MAILDEV_WEB_PORT}, which is a
    # host-side compose var unset inside the container → it probes localhost:
    # with an empty port and always fails. Override with the real internal port.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:1080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [pilotage]

  # -------------------------------------------------------------------------
  # Jaeger / OTLP (traces dev) — opt-in via `--profile obs`
  # The default dev stack doesn't need Jaeger; activate explicitly when you
  # want OTLP traces collected.
  # -------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: pilotage_jaeger
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:?JAEGER_UI_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}:16686"   # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks: [pilotage]

  # -------------------------------------------------------------------------
  # Prisma migrator (one-shot avant API) — opt-in via `--profile app`
  # In local dev you run `pnpm prisma:migrate:dev` directly from the host.
  # Ce service applique des migrations revues ; il ne synchronise plus le schéma.
  # -------------------------------------------------------------------------
  migrator:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
      target: build
    container_name: pilotage_migrator
    # `seed` figure ici en plus de `app` parce que `seed` en dépend (PF-86) :
    # Compose exige qu'un service dont on dépend soit activé par le profil qu'on
    # active, sinon le projet est INVALIDE — pas dégradé, invalide. `--profile
    # seed` seul échouait donc sur *"service seed depends on undefined service"*.
    profiles: ["app", "seed", "prod"]
    environment:
      <<: *app-env
    # Le schéma est piloté par un historique SQL revu (apps/api/prisma/migrations),
    # appliqué via `prisma migrate deploy`. L'entrypoint REFUSE de migrer une base
    # qui porte déjà un schéma sans `_prisma_migrations` : la baseline est une
    # action opérateur (docs/runbooks/baseline-hosted-database.md).
    # Plus de `db push`, plus de `--accept-data-loss` — PF-03 / S-E02-1.
    command: ["sh", "/app/infra/docker/migrate-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pilotage]
    restart: "no"

  # -------------------------------------------------------------------------
  # API (NestJS) — opt-in via `--profile app`
  # Default dev uses `pnpm dev` from the host; this container is only useful
  # for a fully containerized stack (CI, prod).
  # -------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
      args:
        # Grave DANS l'image le commit dont elle est issue (S-E02-6 / VAL-10, R-05).
        GIT_SHA: ${GIT_SHA:-}
    container_name: pilotage_api
    # `prod` en plus de `app` : `nginx` (profil `prod`) depend de ce service,
    # et Compose exige que la dependance soit activee par le meme profil, sinon le
    # projet entier est INVALIDE. `--profile prod` seul echouait sur
    # *"service nginx depends on undefined service web"* (PF-86, decouvert par
    # scripts/compose-invocation-check.js).
    profiles: ["app", "prod"]
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "4000"
      # ---- Seconde connexion : le rôle applicatif sous RLS (S-E01-1h / PF-02) --
      #
      # LA COUTURE TENANT N'ÉTAIT PAS ENFORCÉE SUR CETTE PILE, et rien ne le
      # disait. `AppRolePrismaService` n'ouvre sa seconde connexion QUE si cette
      # variable est déclarée ; elle ne l'était nulle part dans ce fichier. Les
      # sites d'appel convertis (calendar, lessons, announcements) tournaient
      # donc sur la connexion du PROPRIÉTAIRE — qui porte `BYPASSRLS` — dans
      # l'état nommé `degraded_no_app_url`, jauge `pilotage_tenant_scope_enforced`
      # à 0. Les policies pouvaient exister, le GUC était posé, et PostgreSQL
      # n'avait aucune raison de refuser quoi que ce soit : le rôle sous test
      # n'était jamais celui qui exécutait. C'est PF-242.
      #
      # Déclarée ICI et pas sur l'ancre `x-app-env`, pour la même raison
      # qu'`OTEL_EXPORTER_OTLP_ENDPOINT` : seul un service qui CONSOMME cette
      # connexion doit se la voir déclarer. `migrator` doit garder le
      # propriétaire (il crée les objets, et un GRANT ne se donne pas à soi-même),
      # et `worker` n'a pas de tenant de requête — ses 99 sites d'appel sont
      # énumérés HORS portée par `tenant-adversarial-check.js`. Leur déclarer
      # cette URL annoncerait une capacité qu'aucune instruction n'exerce.
      #
      # Hôte `postgres:5432` (réseau Compose), JAMAIS `localhost:5433` comme
      # dans `.env.example` : une adresse hôte ne résout pas depuis ce
      # conteneur, et l'échec serait SILENCIEUX — `AppRolePrismaService` dégrade
      # au lieu de crasher, donc une URL fausse rend exactement la même jauge à 0
      # qu'une URL absente. Le mot de passe reprend celui qu'
      # `infra/postgres/init/01-extensions.sql` crée pour ce rôle, comme
      # `DATABASE_URL` reprend celui de `pilotage` : pile de développement, la
      # rotation est une action opérateur.
      DATABASE_URL_APP: postgresql://app_user:app_user@postgres:5432/pilotage?schema=public
      # Ce que l'opérateur CROIT déployer, injecté au démarrage et comparé au
      # GIT_SHA gravé au build. Non renseigné ⇒ verdict `unverified` : rien n'est
      # bloqué, mais `GET /version` le dit au lieu de laisser croire à une
      # vérification qui n'a pas eu lieu (DNC-08).
      EXPECTED_GIT_SHA: ${EXPECTED_GIT_SHA:-}
      # Collecteur de traces (S-E02-14 / PF-78). Explicite ici plutôt que sur
      # l'ancre partagée : seuls les services qui démarrent réellement le SDK
      # doivent se voir déclarer un collecteur.
      #
      # Le défaut est **vide**, donc traçage désactivé, et c'est délibéré :
      # `jaeger` vit dans le profil `obs` alors qu'`api` et `worker` vivent dans
      # `app`. Pointer par défaut sur `http://jaeger:4318` ferait que la pile de
      # dev ordinaire — lancée sans `--profile obs` — exporterait en boucle vers
      # un nom qui ne résout pas, et noierait les logs sous des échecs
      # d'export. Comme pour `EXPECTED_GIT_SHA` (S-E02-10), déclarer *est*
      # l'interrupteur, et l'état est journalisé au démarrage plutôt que tu.
      #
      #   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 \
      #     docker compose --env-file .env -f infra/docker-compose.yml \
      #       --profile app --profile obs up
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # jwks-rsa@4 imports the ESM-only jose@6 via require(); Node enables
      # require(ESM) by default from 22.12, so enable it explicitly to stay
      # compatible if the base image ever lags behind. Harmless on newer Node.
      NODE_OPTIONS: "--enable-source-maps --experimental-require-module"
    ports:
      - "${API_PORT:?API_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [pilotage]

  # -------------------------------------------------------------------------
  # Worker (NestJS BullMQ) — opt-in via `--profile app`
  # -------------------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
      args:
        GIT_SHA: ${GIT_SHA:-}
    container_name: pilotage_worker
    # `prod` aussi : le profil `prod` pretend demarrer "le mode prod", et un mode
    # prod sans son worker n' est pas le mode prod — c' est la meme faute que
    # PF-86 (une commande documentee qui demarre autre chose que ce qu' elle
    # annonce), a une adresse que la regle de validite seule n' aurait pas atteinte.
    profiles: ["app", "prod"]
    restart: unless-stopped
    environment:
      <<: *app-env
      # Même attente que l'API (S-E02-10 / PF-68) : le worker portait déjà un
      # GIT_SHA gravé au build, mais rien ne lui donnait à quoi le comparer, donc
      # une dérive du worker — qui écrit des données réelles — était invisible.
      EXPECTED_GIT_SHA: ${EXPECTED_GIT_SHA:-}
      # Voir la note côté api (S-E02-14 / PF-78).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      WORKER_HTTP_PORT: "4001"
      # See api note — jwks-rsa@4 / jose@6 require(ESM) compatibility.
      NODE_OPTIONS: "--enable-source-maps --experimental-require-module"
    ports:
      # Manifeste de release uniquement (GET /version/worker). Publié en LOOPBACK :
      # la gate tourne sur l'hôte, personne d'autre n'a besoin de ce socket.
      - "127.0.0.1:${WORKER_HTTP_PORT:?WORKER_HTTP_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks: [pilotage]

  # -------------------------------------------------------------------------
  # Web (Next.js) — opt-in via `--profile app`
  # -------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # NEXT_PUBLIC_* are INLINED at build time into both client AND server
        # bundles, so the runtime env can't override them. The API base is only
        # ever used server-side (server components + the /api/proxy route) — the
        # browser calls the same-origin /api/proxy — so bake the INTERNAL url.
        # If it were localhost:4000, the web container's SSR fetch hits its own
        # localhost and ECONNREFUSEs.
        NEXT_PUBLIC_API_URL: http://api:4000
        # Browser-facing: KC login redirects must hit the host-published port.
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:?KEYCLOAK_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}
        NEXT_PUBLIC_KEYCLOAK_REALM: pilotage-scolaire
        GIT_SHA: ${GIT_SHA:-}
    container_name: pilotage_web
    # `prod` en plus de `app` : `nginx` (profil `prod`) depend de ce service,
    # et Compose exige que la dependance soit activee par le meme profil, sinon le
    # projet entier est INVALIDE. `--profile prod` seul echouait sur
    # *"service nginx depends on undefined service web"* (PF-86, decouvert par
    # scripts/compose-invocation-check.js).
    profiles: ["app", "prod"]
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "3000"
      # ---- Provenance client, moitié WEB (S-E04-3 / PF-31, ADR-036 D3/D10) ----
      #
      # Compte les relais devant **Next**, et c'est une clé DISTINCTE de
      # `TRUST_PROXY_HOPS` (ancre `x-app-env`, qui compte ceux devant l'API) : les
      # deux chemins n'ont pas la même profondeur, et une clé unique en aurait
      # rendu un des deux silencieusement faux.
      #
      # Posée ICI et pas sur l'ancre, pour la raison déjà écrite plus bas à propos
      # de `WEB_METRICS_PORT` : sur l'ancre elle retomberait sur `migrator` et
      # `seed`, qui ne rendent aucune page.
      #
      # Forme refusante `${VAR:?}`, comme son jumeau API — et c'est précisément
      # parce que le lecteur, lui, ne refuse PAS. `webTrustProxyHops()` retombe sur
      # `0` (blanc honnête) plutôt que de lever au RENDU d'une requête, ce qui
      # rendrait la page entière en 500. Cette retombée sûre est aussi ce qui rend
      # une clé absente INVISIBLE : la fonctionnalité serait livrée inerte, sans
      # autre signal qu'un `console.warn`. Le refus se produit donc là où il ne
      # coûte rien — dans le terminal de l'opérateur, à la commande compose.
      #
      # `0` en local (profil `app`) : `nginx` porte `profiles: ["prod"]` et ne
      # tourne pas, donc aucun relais L7 n'est devant Next et tout
      # `x-forwarded-for` reçu vient du client — il est jeté (ADR-036 D1/D4).
      WEB_TRUST_PROXY_HOPS: ${WEB_TRUST_PROXY_HOPS:?WEB_TRUST_PROXY_HOPS manquant — ADR-036 D10, le nombre de relais devant Next est une propriete du deploiement (0 en local, 2 en prod) et n'est PAS TRUST_PROXY_HOPS}
      # Même attente que l'API (S-E02-10 / PF-68). Le web est l'artefact que les
      # utilisateurs voient : c'est sur lui qu'une dérive est le plus coûteuse, et
      # c'était l'un des deux tiers du déploiement que la gate n'interrogeait pas.
      EXPECTED_GIT_SHA: ${EXPECTED_GIT_SHA:-}
      # Server-side only: the Next server (proxy route + server components) reaches
      # the API over the internal docker network. Client bundles never use this —
      # the browser calls the same-origin /api/proxy route, which fans out here.
      NEXT_PUBLIC_API_URL: http://api:4000
      # Browser-facing: login redirects must hit the host-published Keycloak port.
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:?KEYCLOAK_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}
      NEXT_PUBLIC_KEYCLOAK_REALM: pilotage-scolaire
      # NextAuth v5 (Auth.js) REQUIRES a secret to sign session JWTs — without it
      # every /api/auth/* call 500s with MissingSecret and login is impossible.
      AUTH_SECRET: ${AUTH_SECRET:-pilotage-dev-auth-secret-change-me-min-32-chars-0a1b2c3d}
      # Canonical public URL — makes NextAuth redirects/callbacks deterministic
      # (otherwise it can fall back to the bound HOSTNAME 0.0.0.0).
      AUTH_URL: http://localhost:${WEB_PORT:-3000}
      # Per-portal Keycloak client secrets (must match the realm). Defaults align
      # with the imported realm so credentials (ROPC) login works out of the box.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-change-me-portal-admin}
      KEYCLOAK_TEACHER_CLIENT_SECRET: ${KEYCLOAK_TEACHER_CLIENT_SECRET:-change-me-portal-teacher}
      KEYCLOAK_PARENT_CLIENT_SECRET: ${KEYCLOAK_PARENT_CLIENT_SECRET:-change-me-portal-parent}
      # Observabilité web (S-E02-15 / PF-79) — `web` est le TROISIÈME artefact
      # observé, et le dernier à l'avoir été : une page lente était invisible de
      # Prometheus comme de Jaeger pendant que api et worker étaient visibles
      # des deux.
      #
      # Socket de métriques DÉDIÉ, volontairement pas une route Next : le
      # `location /` de infra/nginx/conf.d/pilotage.conf relaie tout ce qui
      # n'est pas apparié vers cet upstream, donc une route `/metrics` serait
      # publique le jour de son ajout. Et AUCUN mapping `ports:` ci-dessous pour
      # lui — contrairement à celui du worker, que la gate de release doit
      # joindre depuis l'hôte : Prometheus l'atteint par nom de service sur le
      # réseau `pilotage`, et le 3001 de l'hôte est déjà pris par `grafana`.
      WEB_METRICS_PORT: "3001"
      # Posé ici et PAS sur l'ancre `x-app-env` — voir la note en tête de
      # fichier : sur l'ancre, il retomberait sur `migrator` et `seed`, qui ne
      # peuvent rien émettre. Vide par défaut ⇒ aucun exportateur n'est ajouté,
      # mais le fournisseur de traces et la mesure Prometheus démarrent quand
      # même (le SDK est aussi l'appareil de mesure ici).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${WEB_PORT:?WEB_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [pilotage]

  # -------------------------------------------------------------------------
  # Seed (one-shot, dev only)
  # -------------------------------------------------------------------------
  # S-E02-4 : `prisma/seed-guard.ts` exige un opt-in explicite. Ici il est fourni
  # par défaut — activer le profil `seed` EST déjà le geste délibéré, et cette
  # stack est non-production par construction. `docker-compose.prod.yml` écrase
  # cette valeur par une chaîne vide : sur la stack hébergée, l'opt-in doit être
  # déclaré à la main dans .env.prod.
  seed:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
      target: build
    container_name: pilotage_seed
    profiles: ["seed"]
    environment:
      <<: *app-env
      ALLOW_SEED: ${ALLOW_SEED:-provision-demo-data}
    # No `prisma.seed` key in package.json — run the tsx seed script directly.
    command: ["pnpm", "--filter", "@pilotage/api", "run", "prisma:seed"]
    # Dépend du MIGRATOR, pas de l'`api` (PF-86). Deux raisons, et la seconde
    # n'est pas cosmétique :
    #   1. `api` vit dans le profil `app` : `--profile seed` seul produisait
    #      *"service seed depends on undefined service api"*, donc la commande
    #      de seed documentée ne pouvait pas fonctionner ;
    #   2. le seed écrit dans Postgres via tsx — il n'appelle jamais l'API. Ce
    #      dont il a réellement besoin, c'est que les migrations soient
    #      appliquées. Dépendre de l'`api` l'exprimait par transitivité
    #      (`api` attend `migrator`), en démarrant trois conteneurs de plus
    #      pour une dépendance qui n'était pas la sienne.
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [pilotage]
    restart: "no"

  # -------------------------------------------------------------------------
  # Nginx reverse proxy (profile prod uniquement)
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: pilotage_nginx
    profiles: ["prod"]
    restart: unless-stopped
    # Host ports are parametrised so the stack can run BEHIND an existing ingress
    # (e.g. Traefik already owning 80/443 on a shared VPS). In that mode set
    # HTTP_PORT/HTTPS_PORT to 127.0.0.1-bound values in .env and route Traefik to
    # this container over a shared docker network (see infra/docker-compose.prod.yml).
    ports:
      - "${HTTP_PORT:?HTTP_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}:80"
      - "${HTTPS_PORT:?HTTPS_PORT manquant, lancez Compose depuis la racine du depot avec --env-file .env (PF-86)}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [pilotage]

  # -------------------------------------------------------------------------
  # Observability stack (profile obs uniquement) — Phase 4+
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: pilotage_prometheus
    profiles: ["obs"]
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [pilotage]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: pilotage_grafana
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3001:3000"]
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [pilotage]

  loki:
    image: grafana/loki:3.2.0
    container_name: pilotage_loki
    profiles: ["obs"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    networks: [pilotage]
